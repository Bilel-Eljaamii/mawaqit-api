# Publish the crate to crates.io whenever a GitHub release is published.
#
# Requires one repository secret:
#   CRATES_IO_TOKEN — a crates.io API token with the publish-new and
#   publish-update scopes (https://crates.io/settings/tokens).
#
# The release tag must match the crate version (v0.4.3 → 0.4.3): the
# publish job hard-fails on a mismatch before touching the registry. The
# verify job runs the same `just verify` gate as ci.yml — a release never
# publishes code that failed the offline suite. Same dependency-free
# design as ci.yml: no caching actions in the supply chain.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable toolchain plus the two no_std MCU targets the feature
      # matrix type-checks (ADR-0013/0014) — same gate as ci.yml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,riscv32imc-unknown-none-elf
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov

      - name: just verify
        run: just verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Release tag must match the crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "release tag: $GITHUB_REF_NAME → crate version: $version"
          grep -qx "version = \"$version\"" Cargo.toml \
            || { echo "ERROR: Cargo.toml version does not match the release tag $GITHUB_REF_NAME — bump the version, then create the release"; exit 1; }

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
