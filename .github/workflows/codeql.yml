# CodeQL — advanced setup on a nightly schedule only.
#
# The default setup (actions + rust, weekly, push/PR-triggered) was
# disabled in favor of this workflow: code scanning belongs to the
# nightly HIL cadence, not to every push. 01:00 UTC = 02:00 in Tunis.
# Manual run: Actions → CodeQL → Run workflow.
name: CodeQL

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
