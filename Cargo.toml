[package]
name = "mawaqit-api"
version = "0.4.3"
edition = "2024"
license = "MIT"
description = "Privacy-first Rust client for Mawaqit prayer times and mosque data. No API key required, no personal data stored or sent. Includes offline disk caching, full iqama calendar resolution, adhan voice downloads, and hostile-input tested security hardening"
repository = "https://github.com/Bilel-Eljaamii/mawaqit-api"
homepage = "https://github.com/Bilel-Eljaamii/mawaqit-api"
readme = "README.md"
keywords = ["prayer", "islamic", "adhan", "mosque", "timing"]
categories = ["command-line-utilities"]

# Integration tests live in tst/ as a four-tier pyramid, each tier one test
# binary with its submodules in the same-named directory (see tst/*.rs):
#   ut  — pure parsing/calendar semantics, no I/O
#   ct  — one component at a time against local mocks (HTTP, disk)
#   e2e — the live mawaqit.net world tour (#[ignore]d by default)
#   fuzz— deterministic seed-driven mutation fuzzing
[[test]]
name = "ut"
path = "tst/ut.rs"
required-features = ["std"]

[[test]]
name = "ct"
path = "tst/ct.rs"
required-features = ["std"]

[[test]]
name = "e2e"
path = "tst/e2e.rs"
required-features = ["std"]

[[test]]
name = "fuzz"
path = "tst/fuzz.rs"
required-features = ["std"]

# Declared (not auto-discovered) so every test target shares one lib build:
# a second lib variant would split the function records across two coverage
# hash families and llvm-cov's aggregate summary undercounts (see
# `just coverage`).
[[test]]
name = "voices"
path = "tests/voices.rs"
required-features = ["std"]

[features]
default = ["std"]
# std: desktop/server/CLI — the domain (alloc tier) plus the transport
# infrastructure (reqwest/tokio/fs) and the MQTC packer tooling. Per
# ADR-0013's matrix, std includes the heapless feature so pack_for_mcu
# sees the compact API without extra flags.
std = [
    "alloc",
    "heapless",
    "dep:reqwest",
    "dep:tokio",
    "chrono/std",
    "chrono/clock",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
]
# alloc: no_std targets with an embedded heap (ESP32, RP2040) — dynamic
# ConfData, parse_page, calendar resolution. Pulls in serde_json, which
# cannot compile without an allocator.
alloc = ["chrono/alloc", "serde/alloc", "serde_json/alloc", "dep:serde_json"]
# heapless: pure zero-alloc MCU firmware — CompactCalendarView over
# memory-mapped flash.
heapless = ["dep:heapless", "dep:crc32fast"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
# reqwest 0.13 defaults to rustls (no OpenSSL), so this cross-compiles to
# Windows MSVC from Linux as-is. "socks" enables the socks5h:// proxy
# opt-in (Tor routing) — see MawaqitClient::with_socks_proxy.
reqwest = { version = "0.13.5", features = [
    "json",
    "query",
    "socks",
], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
# Optional: no_std tiers without an allocator cannot compile serde_json at
# all — it is wired into the `alloc` feature.
serde_json = { version = "1.0.151", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", features = [
    "macros",
    "rt-multi-thread",
], optional = true }
heapless = { version = "0.9.3", default-features = false, optional = true }
crc32fast = { version = "1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }
